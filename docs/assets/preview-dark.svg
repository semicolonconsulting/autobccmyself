  <line x1="36" y1="104.5" x2="476" y2="104.5" stroke="#2a313a"/>

  <text x="36" y="135" font-size="14" fill="#9198a1">Bcc</text>
  <rect x="84.5" y="116.5" width="147" height="27" rx="13.5" fill="#152a45" stroke="#58a6ff"/>
  <text x="100" y="135" font-size="13" font-weight="600" fill="#58a6ff">you@example.com</text>
  <rect x="244" y="119" width="138" height="22" rx="11" fill="#58a6ff"/>
  <text x="313" y="134" font-size="11.5" font-weight="600" fill="#0d1117" text-anchor="middle">Added automatically</text>
  <line x1="36" y1="148.5" x2="476" y2="148.5" stroke="#2a313a"/>

  <text x="36" y="177" font-size="14" font-weight="500" fill="#e6edf3">Project timeline</text>
  <line x1="36" y1="192.5" x2="476" y2="192.5" stroke="#2a313a"/>

  <rect x="36" y="210" width="380" height="8" rx="4" fill="#2a313a"/>
  <rect x="36" y="228" width="420" height="8" rx="4" fill="#2a313a"/>
  <rect x="36" y="246" width="300" height="8" rx="4" fill="#2a313a"/>

  <rect x="36" y="276" width="84" height="32" rx="16" fill="#58a6ff"/>
  <text x="78" y="297" font-size="13" font-weight="600" fill="#0d1117" text-anchor="middle">Send</text>

  <!-- Arrow -->
  <line x1="508" y1="170" x2="554" y2="170" stroke="#9198a1" stroke-width="1.6" stroke-linecap="round" marker-end="url(#head)"/>

  <!-- Inbox -->
  <g clip-path="url(#inbox)">
    <rect x="568" y="16" width="296" height="308" fill="#161b22"/>
    <rect x="568" y="16" width="296" height="44" fill="#1c2128"/>
    <rect x="568" y="60" width="296" height="64" fill="#152a45"/>
    <rect x="568" y="60" width="4" height="64" fill="#58a6ff"/>
  </g>
  <rect x="568.5" y="16.5" width="295" height="307" rx="11.5" fill="none" stroke="#30363d"/>
  <text x="588" y="44" font-size="15" font-weight="600" fill="#e6edf3">Inbox</text>

  <text x="588" y="87" font-size="14" font-weight="600" fill="#e6edf3">me, Alex</text>
  <text x="844" y="87" font-size="12" fill="#9198a1" text-anchor="end">9:41</text>
  <text x="588" y="108" font-size="13" fill="#e6edf3">Project timeline</text>
  <line x1="568" y1="124.5" x2="864" y2="124.5" stroke="#2a313a"/>

  <rect x="588" y="142" width="90" height="8" rx="4" fill="#2a313a"/>
  <rect x="588" y="160" width="190" height="8" rx="4" fill="#2a313a"/>
  <line x1="568" y1="184.5" x2="864" y2="184.5" stroke="#2a313a"/>
  <rect x="588" y="202" width="110" height="8" rx="4" fill="#2a313a"/>
  <rect x="588" y="220" width="160" height="8" rx="4" fill="#2a313a"/>
  <line x1="568" y1="244.5" x2="864" y2="244.5" stroke="#2a313a"/>
  <rect x="588" y="262" width="80" height="8" rx="4" fill="#2a313a"/>
  <rect x="588" y="280" width="200" height="8" rx="4" fill="#2a313a"/>
